name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Create runtime config
        env:
          TRACKITMX_FIREBASE_WEB_API_KEY: ${{ secrets.TRACKITMX_FIREBASE_WEB_API_KEY }}
        run: |
          if [ -z "${TRACKITMX_FIREBASE_WEB_API_KEY}" ]; then
            echo "Missing TRACKITMX_FIREBASE_WEB_API_KEY GitHub secret." >&2
            exit 1
          fi

          {
            echo 'window.TRACKITMX_RUNTIME = Object.assign({}, window.TRACKITMX_RUNTIME, {'
            echo "  firebaseWebApiKey: '${TRACKITMX_FIREBASE_WEB_API_KEY}'"
            echo '});'
          } > runtime-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
