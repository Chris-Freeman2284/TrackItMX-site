<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackItMX | Opening Group Ride</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#070504">
  <link rel="icon" type="image/png" href="../../assets/trackitmx-mark.png">
  <link rel="apple-touch-icon" href="../../assets/trackitmx-mark.png">
  <link rel="manifest" href="../../site.webmanifest">
  <link rel="stylesheet" href="../../styles.css">
  <script>
    (function () {
      const current = new URL(window.location.href);
      const code = current.searchParams.get("code") || current.searchParams.get("room") || "";
      const next = new URL("/group-ride/live/", current.origin);

      if (code) {
        next.searchParams.set("code", code);
      }

      window.location.replace(next.toString());
    })();
  </script>
</head>
<body class="page page--inner">
  <div class="site-grit" aria-hidden="true"></div>
  <main class="spectator-main">
    <section class="section spectator-entry">
      <div class="spectator-entry__panel">
        <div class="spectator-entry__copy">
          <p class="eyebrow">Redirecting</p>
          <h1>Opening spectator mode.</h1>
          <p class="hero__lede">If the room does not open automatically, <a href="../live/">tap here</a>.</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
